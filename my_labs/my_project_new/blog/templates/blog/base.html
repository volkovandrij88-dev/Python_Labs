<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Транспортне Агентство</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="/blog/">
            TransportUA
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="navbarMenu">

            <ul class="navbar-nav me-auto">

                <li class="nav-item">
                    <a class="nav-link" href="/blog/">
                        Головна
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/blog/?search=Варшава">
                        Варшава
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/blog/?search=Берлін">
                        Берлін
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/blog/?search=Рига">
                        Рига
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/blog/?search=Таллінн">
                        Таллінн
                    </a>
                </li>

                {% if user.is_authenticated %}

                <li class="nav-item">
                    <a class="nav-link" href="/blog/my-tickets/">
                        Мої квитки
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/blog/profile/">
                        Особистий кабінет
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/blog/logout/">
                        Вийти
                    </a>
                </li>

                {% else %}

                <li class="nav-item">
                    <a class="nav-link" href="/blog/login/">
                        Увійти
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/blog/register/">
                        Зареєструватись
                    </a>
                </li>

                {% endif %}

            </ul>

        </div>

    </div>

</nav>

<div class="container mt-5">

    {% block content %}
    {% endblock %}

</div>

<footer class="bg-light text-center py-4 mt-5">
    <p>© 2026 Лабораторна №5. Виконав Андрій.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
