<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Транспортне Агентство</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <style>

body {
    background: linear-gradient(to bottom right, #eef2f7, #dfe9f3);
    font-family: Arial, sans-serif;
    min-height: 100vh;
}

.navbar {
    background: linear-gradient(90deg, #141e30, #243b55) !important;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    padding-top: 12px;
    padding-bottom: 12px;
}

.navbar-brand {
    font-size: 28px;
    font-weight: bold;
    color: white !important;
}

.nav-link {
    color: rgba(255,255,255,0.85) !important;
    transition: 0.2s;
}

.nav-link:hover {
    color: white !important;
    transform: translateY(-1px);
}

.card {
    border: none;
    border-radius: 18px;
    overflow: hidden;
    transition: 0.3s;
    box-shadow: 0 6px 20px rgba(0,0,0,0.08);
}

.card:hover {
    transform: translateY(-6px);
    box-shadow: 0 15px 35px rgba(0,0,0,0.15);
}

.card-header {
    padding: 18px;
    font-size: 20px;
}

.card-body {
    padding: 24px;
}

.btn {
    border-radius: 12px;
    font-weight: 600;
    padding: 10px 18px;
}

.btn-primary {
    background: linear-gradient(90deg, #0066ff, #0051cc);
    border: none;
}

.btn-primary:hover {
    background: linear-gradient(90deg, #0051cc, #003d99);
}

.btn-outline-primary:hover {
    transform: scale(1.03);
}

.form-control {
    border-radius: 12px;
    padding: 12px;
}

.badge {
    padding: 8px 12px;
    font-size: 13px;
    border-radius: 10px;
}

h1, h2, h3, h4 {
    font-weight: bold;
}

.container {
    animation: fadeIn 0.4s ease;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(8px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

</style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="/blog/">
            TransportUA
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="navbarMenu">

            <ul class="navbar-nav me-auto">

                <li class="nav-item">
                    <a class="nav-link" href="/blog/">
                        Головна
                    </a>
                </li>


                {% if user.is_authenticated %}

                <li class="nav-item">
                    <a class="nav-link" href="/blog/my-tickets/">
                        Мої квитки
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/blog/profile/">
                        Особистий кабінет
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/blog/logout/">
                        Вийти
                    </a>
                </li>

                {% else %}

                <li class="nav-item">
                    <a class="nav-link" href="/blog/login/">
                        Увійти
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/blog/register/">
                        Зареєструватись
                    </a>
                </li>

                {% endif %}

            </ul>

        </div>

    </div>

</nav>

<div class="container mt-5">

    {% block content %}
    {% endblock %}

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
