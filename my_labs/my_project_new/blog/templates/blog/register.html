{% extends 'blog/base.html' %}

{% block content %}

<div class="container mt-5">
    <div class="card shadow mx-auto p-4" style="max-width: 400px;">
        <h2 class="text-center mb-4">Реєстрація</h2>

        <form method="post">
            {% csrf_token %}

            <input type="text" name="username" class="form-control mb-3" placeholder="Логін">
            <input type="email" name="email" class="form-control mb-3" placeholder="Email">
            <input type="password" name="password" class="form-control mb-3" placeholder="Пароль">

            <button class="btn btn-success w-100">Зареєструватись</button>
        </form>
    </div>
</div>

{% endblock %}
